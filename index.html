<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Calendar Trick</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="site">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">7</span>Calendar Trick</a>
      <nav aria-label="Pages">
        <a href="index.html" aria-current="page">Practice</a>
        <a href="learn.html">Learn</a>
      </nav>
    </header>

    <main class="wrap narrow">
      <section class="trainer" aria-label="Practice">
        <form class="range" onsubmit="generate(); return false;">
          <label class="field-label" for="years">Years</label>
          <input type="text" id="years" value="2000-2027" autocomplete="off" spellcheck="false">
          <button id="btn-go" type="submit" class="primary">New date</button>
        </form>
        <p class="note" id="years-error" hidden>Enter years like 2000-2027 or 1999,2024. Years must be 1583 or later.</p>

        <div class="date-box">
          <div class="prompt" id="date"></div>
          <div class="prompt-sub">Which weekday?</div>
        </div>

        <div class="answers" id="solutions">
          <button type="button" class="sun" data-day="0" onclick="check(this)">Sun</button>
          <button type="button" data-day="1" onclick="check(this)">Mon</button>
          <button type="button" data-day="2" onclick="check(this)">Tue</button>
          <button type="button" data-day="3" onclick="check(this)">Wed</button>
          <button type="button" data-day="4" onclick="check(this)">Thu</button>
          <button type="button" data-day="5" onclick="check(this)">Fri</button>
          <button type="button" data-day="6" onclick="check(this)">Sat</button>
        </div>

        <div class="stats">
          <span>Score <b id="score">0/0</b></span>
          <span>Last <b id="last-time">–</b></span>
          <span>Average <b id="avg-time">–</b></span>
        </div>

        <div class="trainer-foot">
          <button type="button" class="link" id="help-btn" onclick="toggleHelp()">Show the working</button>
          <div id="help" class="working" hidden></div>
        </div>
      </section>

      <p class="hint">Press <kbd>0</kbd>–<kbd>6</kbd> to answer with the weekday's code. New to this? Start on the <a href="learn.html">Learn</a> page.</p>
    </main>

    <script src="calendar-trick.js"></script>
  </body>
</html>
